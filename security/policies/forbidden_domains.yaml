# 禁止域名列表（反向安全测试）
# 任何出现在生产构建包中的域名，必须不在此列表中
# 更新此文件必须由安全负责人审批（Signed-off-by）
forbidden_domains:
  # 开发环境
  dev:
    - "dev.target_app.com"
    - "dev.api.target_app.com"
    - "dev.auth.target_app.com"
    - "dev.feed-api.target_app.com"
    - "dev.staging.target_app.com"
  # 测试环境
  test:
    - "test.target_app.com"
    - "test.api.target_app.com"
    - "test.auth.target_app.com"
    - "test.feed-api.target_app.com"
    - "test.staging.target_app.com"
    - "test.local"
    - "test.localhost"
  # 预发布 / 灰度
  staging:
    - "staging.target_app.com"
    - "staging.api.target_app.com"
    - "staging.auth.target_app.com"
    - "staging.feed-api.target_app.com"
  # 本地 / 内网
  # 10.x/172.x/192.x 为 RFC1918 私有网段，宽泛前缀匹配误报率高
  # 10. 前缀仅列精确测试 IP（CI/内网常用地址）；172.16-31. 保留前缀匹配
  local:
    - "localhost"
    - "127.0.0.1"
    - "0.0.0.0"
    - "192.168."
    - "10.0.0.1"
    - "10.1.1.1"
    - "10.0.0.0"
    - "172.16."
    - "172.17."
    - "172.18."
    - "172.19."
    - "172.20."
    - "172.21."
    - "172.22."
    - "172.23."
    - "172.24."
    - "172.25."
    - "172.26."
    - "172.27."
    - "172.28."
    - "172.29."
    - "172.30."
    - "172.31."
  # 通用测试模式
  patterns:
    - ".test."
    - ".dev."
    - ".local"
    - "-test"
    - "-dev"
    - ".staging."
    - ".preprod."

# 生产允许白名单（用于对比确认）
production_domains:
  api:
    - "api.target_app.com"
    - "api.feed-api.target_app.com"
  auth:
    - "auth.target_app.com"
  web:
    - "target_app.com"
    - "www.target_app.com"
  deep_link:

# 安全检查分类规则（用于 NS-02A / 门禁策略）
classification:
  FAIL: [dev, test, staging, localhost, 192.168., 172.16.]
  THIRDPARTY: [flutter.dev, docs.flutter.dev, api.flutter.dev, plugins.flutter.dev, android.google.com, firebase.io, analytics.google.com]
